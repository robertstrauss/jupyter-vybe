[build-system]
requires = ["hatchling>=1.5.0", "hatch-nodejs-version>=0.3.2", "hatch-fancy-pypi-readme>=24.1", "jupyter-builder>=1.2.0,<2"]
build-backend = "hatchling.build"

[project]
name = "jupyter_vybe"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jupyter_server>=2.14,<3",
]
dynamic = ["version", "description", "authors", "urls", "keywords", "readme"]

[project.scripts]
# The client-side sidecar (D2 v1.1): `jupyter-vybe-local` on the machine with
# the model, for a Jupyter running somewhere else. Standard library only, so
# `pipx run jupyter-vybe` is enough to get it.
jupyter-vybe-local = "jupyter_vybe.local:main"
# `jupyter-vybe-doctor` checks an installation before anyone blames the model.
jupyter-vybe-doctor = "jupyter_vybe.doctor:main"

[project.optional-dependencies]
# `test` is the name the generated CI workflow installs; keeping it as an
# alias of dev means `pip install .[test]` actually installs pytest rather
# than warning about an unknown extra and quietly running nothing.
test = [
    "jupyterlab>=4.4,<5",
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "pytest-jupyter[server]>=0.6",
]
dev = [
    "jupyterlab>=4.4,<5",
    # scripts/bench-quality.py runs generated code against real assertions,
    # and the cases are array code because that is what the audience writes.
    "numpy>=1.24",
    "jupyter-builder>=1.2.0",
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "pytest-jupyter[server]>=0.6",
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

# PyPI renders the README with no repository around it, so a relative link or
# image there is broken. Rewrite them to point at GitHub; the README itself
# keeps relative links so it still reads offline and in forks.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+\.(?:png|jpe?g|gif|svg))\)'
replacement = '](https://raw.githubusercontent.com/robertstrauss/jupyter-vybe/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/robertstrauss/jupyter-vybe/blob/main/\1)'

[tool.hatch.build.targets.sdist]
artifacts = ["jupyter_vybe/labextension"]
exclude = [".github", "binder", "docs", ".venv", "screenshots", "ui-tests", "coverage"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter_vybe/labextension" = "share/jupyter/labextensions/jupyter-vybe"
"install.json" = "share/jupyter/labextensions/jupyter-vybe/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"

[tool.hatch.build.hooks.version]
path = "jupyter_vybe/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyter_vybe/labextension/static/style.js",
    "jupyter_vybe/labextension/package.json",
]
skip-if-exists = ["jupyter_vybe/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "jupyter_vybe/labextension"

[tool.check-wheel-contents]
ignore = ["W002"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
